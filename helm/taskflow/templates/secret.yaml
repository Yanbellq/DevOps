apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskflow.fullname" . }}-secret
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.secret.dbUser | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  POSTGRES_USER: {{ .Values.secret.dbUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secret.dbPassword | quote }}
  POSTGRES_DB: {{ .Values.config.dbName | quote }}
