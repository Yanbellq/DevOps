apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "taskflow.fullname" . }}-test-connection"
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "taskflow.fullname" . }}-backend:{{ .Values.backend.service.port }}/api/health']
  restartPolicy: Never
